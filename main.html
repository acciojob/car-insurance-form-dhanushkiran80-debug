	<label for='gender'>Gender:</label><br>

	<input type='radio' name='gender' value='male' required>

	<input type='radio' name='gender' value='female' required>

	<label for='carbrand'>Car Brands:</label>
	<select id='cars'>
		<option>BMW</option>
		<option>Audi</option>
		<option>Mercedez</option>
	</select><br>

	</form>
